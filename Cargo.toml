# after updating this file, please run the following command
# so that deps are updated correctly:
#
# cargo generate-lockfile && bazel mod tidy
[package]
name = "monorepo"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "=4.6.10", features = ["derive"] }
swc_common = "=28.0.0"
sha2 = "=0.11.1"
hex = "=0.4.3"
serde_json = "=1.0.154"
swc_atoms = "=11.0.0"
rxp = "=0.2.0"
swc_ecma_parser = "=48.1.0"
swc_ecma_ast = "=31.0.0"
swc_allocator = "=6.0.0"
serenity = "=0.12.5"
cargo = { version = "=0.101.0", features = ["vendored-openssl"] }
tokio = { version = "=1.54.1", features = ["rt", "rt-multi-thread", "macros"] }
