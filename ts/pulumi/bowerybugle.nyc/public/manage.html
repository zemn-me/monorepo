<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Bowery Bugle. Read the print issues.">
<meta name="referrer" content="no-referrer">
<title>Manage issues · The Bowery Bugle</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
<script src="/archive.js" defer></script>
</head>
<body data-manage>
<a class="skip-link" href="#issues">Skip to issues</a>
<div class="paper">
<header><div class="masthead">
<p class="the">The</p>
<h1 aria-label="The Bowery Bugle"><span class="word" aria-hidden="true"><b>B</b><b>o</b><b>w</b><b>e</b><b>r</b><b>y</b></span><span class="word" aria-hidden="true"><b>B</b><b>u</b><b>g</b><b>l</b><b>e</b></span></h1>
</div></header>
<nav class="management-nav" aria-label="Issue management"><a href="/">View site</a><button class="text-button" id="logout" type="button" hidden>Log out</button></nav>
<section id="author-panel" aria-label="Author login">
<form id="login-form"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><button type="submit">Send login link</button></form>
<button id="confirm-login" type="button" hidden>Confirm login</button>
<p id="login-status" role="status"></p>
</section>
<p id="editing-note" hidden>Changes appear on the site immediately.</p>
<p id="edit-status" role="status"></p>
<main id="issues">
<div class="section-heading"><h2>Issues</h2></div>
<p id="archive-status" role="status">Loading issues…</p>
<ol class="issues" id="issue-list" reversed></ol>
<noscript><p>Enable JavaScript to load the PDFs and log in.</p></noscript>
<form id="add-issue" hidden><label for="issue-number">Issue number</label><div class="add-controls"><input id="issue-number" name="number" type="number" min="1" max="9999" required><button type="submit">Add issue</button></div></form>
</main>
<footer></footer>
</div>
</body>
</html>
