---
name: Build staging bundle
description: Package, verify and publish one revision for staging.
inputs:
  artifact-name:
    required: true
    description: Name for the verified deployment archive.
  source-directory:
    required: false
    default: '.'
    description: Checkout containing the Pulumi program and its assets.
runs:
  using: composite
  steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # main
      with:
        android: true
        dotnet: true
        haskell: true
        docker-images: true
        large-packages: false
        swap-storage: true
    - uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093'  # v3.0.0
      name: Acquire federated GCloud credentials for secrets.
      with:
        project_id: 'extreme-cycling-441523-a9'
        workload_identity_provider: >-
          projects/845702659200/locations/global/workloadIdentityPools/github/providers/my-repo
    - name: Read CI secrets from Secret Manager
      # yamllint disable-line rule:line-length
      uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262  # v3.0.0
      id: secrets
      with:
        secrets: |-
          buildbuddy_api_key:extreme-cycling-441523-a9/github-actions-buildbuddy-api-key
    - name: Build and verify staging bundle
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      env:
        BUILDBUDDY_API_KEY: ${{ steps.secrets.outputs.buildbuddy_api_key }}
      run: '"$GITHUB_ACTION_PATH/build.sh"'
    - name: Upload staging bundle
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.source-directory }}/dist/bin/ci/staging/deploy/layers_bundle.tar.gz
        compression-level: 0
        if-no-files-found: error
        overwrite: true
        retention-days: 1
