---
name: Upload deployment bundle
description: Publish the two verified deployment archives together.
inputs:
  artifact-name:
    required: true
    description: Name of the deployment artifact.
  bundle-directory:
    required: true
    description: Directory containing the Bazel archive outputs.
runs:
  using: composite
  steps:
    - name: Upload deployment bundle
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.bundle-directory }}/layers_bundle.tar.gz
          ${{ inputs.bundle-directory }}/runfile_aliases.tar
        compression-level: 0
        if-no-files-found: error
        overwrite: true
        retention-days: 1
