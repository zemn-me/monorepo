# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: RBE executor image
on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/buildbuddy-rbe-rollforward
    paths:
      - .github/workflows/rbe-image.yml
      - bzl/remote_execution/BUILD.bazel
      - MODULE.bazel
      - MODULE.bazel.lock
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate image publisher
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          auth = base64.b64encode(
              f"{os.environ['GITHUB_ACTOR']}:{os.environ['GHCR_TOKEN']}".encode()
          ).decode()
          directory = Path(os.environ['RUNNER_TEMP']) / 'rbe-registry-auth'
          directory.mkdir(mode=0o700)
          config = directory / 'config.json'
          config.write_text(json.dumps({'auths': {'ghcr.io': {'auth': auth}}}))
          config.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'DOCKER_CONFIG={directory}\n')
          PY
      - name: Verify bootstrap image
        run: |
          ./sh/bin/bazel run --config=ci-local //bzl/remote_execution:load
          docker run --rm -e TEST_TMPDIR=/tmp \
            -v "$PWD/bzl/remote_execution:/checks:ro" \
            monorepo-rbe:verify bash /checks/environment_test.sh
      - name: Build and publish with rules_oci
        run: |
          ./sh/bin/bazel run --config=ci-local \
            //bzl/remote_execution:push -- --tag "$GITHUB_SHA"
          ./sh/bin/bazel build --config=ci-local //bzl/remote_execution:image.digest
          digest="$(cat dist/bin/bzl/remote_execution/image.json.sha256)"
          echo "Published ghcr.io/zemn-me/monorepo-rbe-ubuntu@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry credentials
        if: always()
        run: rm -rf "$DOCKER_CONFIG"
