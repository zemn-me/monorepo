# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---


name: Renovate
# yamllint disable rule:line-length
concurrency:
  # if another instance of renovate is running,
  # do not attempt to run overlapping instances.
  group: renovate
on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  schedule:
    # The "*" (#42, asterisk) character has special semantics in YAML, so this
    # string has to be quoted.
    - cron: '0/15 * * * *'
jobs:
  renovate:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Bazel registry dates
        run: |
          mkdir -p "$RUNNER_TEMP/bcr"
          if curl --fail --silent --show-error --location --retry 3 \
            https://registry.bazel.build/registry.pb.gz -o "$RUNNER_TEMP/registry.pb.gz"; then
            ./sh/bin/bazel run --config=ci-local //py/ci/renovate_bcr:feed -- \
              "$RUNNER_TEMP/registry.pb.gz" "$RUNNER_TEMP/bcr"
          else
            echo "::warning::BCR index unavailable. Public Bazel module lookups will be skipped."
          fi
      - name: Read tested Renovate version
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_ENV"
          import json
          with open("package.json") as manifest:
              print("RENOVATE_VERSION=" + json.load(manifest)["devDependencies"]["renovate"])
          PYTHON
      - uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
        name: Acquire federated GCloud credentials for secrets...
        id: secret_auth
        with:
          project_id: 'extreme-cycling-441523-a9'
          workload_identity_provider: 'projects/845702659200/locations/global/workloadIdentityPools/github/providers/my-repo'
      - uses: 'google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262' # v3.0.0
        name: Read Renovate token from Secret Manager
        id: secrets
        with:
          secrets: |-
            gh_pat:extreme-cycling-441523-a9/github-actions-gh-pat
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        env:
          # The file datasource reads from the bot's own clone. Git copies the
          # template's bcr directory into .git when it creates that clone.
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"GIT_TEMPLATE_DIR":"/renovate-git-template"}'
        with:
          configurationFile: .github/renovate-global.json
          docker-cmd-file: .github/renovate-entrypoint.sh
          docker-user: root
          docker-volumes: /tmp:/tmp;${{ runner.temp }}/bcr:/renovate-git-template/bcr:ro
          renovate-version: ${{ env.RENOVATE_VERSION }}
          token: ${{ steps.secrets.outputs.gh_pat }}
    env:
      LOG_LEVEL: 'debug'
