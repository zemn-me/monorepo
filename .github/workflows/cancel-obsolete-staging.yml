# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Cancel obsolete merge-group runs

on: # yamllint disable-line rule:truthy
  pull_request_target:
    types: [dequeued]
  delete:
  schedule:
    # Ref deletion can lag the dequeue event; also recover missed events.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Cleanup must run independently of the serialized deployment queue.
concurrency:
  group: cancel-obsolete-staging
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This workflow has a write token: execute only its trusted revision.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Cancel obsolete checks and pending staging deployments
        run: |
          ./sh/bin/bazel run --config=ci \
            //py/ci/cancel_obsolete_staging:cancel_obsolete_staging_bin -- \
            --execute
        env:
          GH_TOKEN: ${{ github.token }}
