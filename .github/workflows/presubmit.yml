# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---

name: Presubmit
# yamllint disable rule:line-length
#

on:   # yamllint disable-line rule:truthy
  merge_group:
    branches:
      - main
      - renovate/**
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited # not in the default set, will run on rebase.

env:
  BAZEL: ./sh/bin/bazel


jobs:
  Presubmit:
    permissions:
      contents: read
      id-token: write
    concurrency:
      # > The ref given is fully-formed, meaning that for branches the format
      # > is refs/heads/<branch_name>,
      # > for pull requests it is refs/pull/<pr_number>/merge,
      # > and for tags it is refs/tags/<tag_name>. For example,
      # > refs/heads/feature-branch-1.
      #
      # This should cancel a prior presubmit when a new change comes in.
      group: >
        ${{ github.workflow }}-
        ${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # Performs all offline testing.
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
        name: Acquire presubmit credentials
        id: secret_auth
        continue-on-error: true
        with:
          project_id: 'extreme-cycling-441523-a9'
          workload_identity_provider: >-
            ${{ github.event_name == 'pull_request'
                && 'projects/845702659200/locations/global/workloadIdentityPools/github-presubmit-cache/providers/my-repo'
                || 'projects/845702659200/locations/global/workloadIdentityPools/github/providers/my-repo' }}
      - uses: 'google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262' # v3.0.0
        if: steps.secret_auth.outcome == 'success'
        name: Read CI secrets from Secret Manager
        id: secrets
        continue-on-error: true
        with:
          secrets: |-
            readonly_buildbuddy_api_key:extreme-cycling-441523-a9/github-actions-readonly-buildbuddy-api-key
      - name: Presubmit
        run: |
         ./.github/workflows/prepare_ci.sh && \
         echo "::group::Presubmit prep" && \
         $BAZEL build --config="$BAZEL_CI_CONFIG" --tool_tag=presubmit //ci:presubmit && \
         echo "::endgroup::" && \
         echo "::group::Presubmit" && \
         $BAZEL run --config="$BAZEL_CI_CONFIG" --tool_tag=presubmit //ci:presubmit -- --skip-pulumi-deploy && \
         echo "::endgroup::"
        env:
          BUILDBUDDY_API_KEY: ${{ steps.secrets.outputs.readonly_buildbuddy_api_key }}
          BUILDBUDDY_CACHE_READ_ONLY: 'true'
          BAZEL_TEST_UNCACHED: ${{ runner.debug == '1' && 'true' || 'false' }}
          BAZEL_CI_CONFIG: >-
            ${{ steps.secrets.outputs.readonly_buildbuddy_api_key != ''
                && 'ci-presubmit' || 'ci-local' }}
      - name: Collect oversized Bazel output
        if: always()
        run: |
          BAZEL_OUTPUT_PATH="$($BAZEL info output_path)" python3 - <<'PYTHON'
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ["BAZEL_OUTPUT_PATH"])
          destination = Path(os.environ["RUNNER_TEMP"]) / "bazel-large-output"
          logs = [*root.glob("*/testlogs/**/test.log"), *root.glob("_tmp/actions/std*")]
          for log in logs:
              # Bazel's default console output limit is 1 MiB.
              if log.is_file() and log.stat().st_size > 1024 * 1024:
                  target = destination / log.relative_to(root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(log, target)
          PYTHON
      - name: Upload oversized Bazel output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-large-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-large-output
          if-no-files-found: ignore
          retention-days: 3
