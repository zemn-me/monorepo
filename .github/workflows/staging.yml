# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---

name: Staging
# yamllint disable rule:line-length
#

on:   # yamllint disable-line rule:truthy
  merge_group:
    branches:
      # presubmit
      - main
      - renovate/**

permissions:
  contents: read

jobs:
  BuildCandidate:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/build-deploy-bundle
        with:
          artifact-name: staging-candidate

  PinMain:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.main.outputs.commit }}
    steps:
      - name: Pin main for this staging run
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  MainBundle:
    needs: PinMain
    # A push starts the publisher immediately. Queue here while it builds,
    # before allocating a runner or taking the Pulumi lock.
    concurrency:
      group: deploy-v2-main-bundle-${{ needs.PinMain.outputs.commit }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.published.outputs.run-id || github.run_id }}
      artifact-name: deploy-v2-main-${{ needs.PinMain.outputs.commit }}
    steps:
      - name: Checkout staging workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github
            ci/deploy
            py/ci
            third_party/bazel_distdir
          persist-credentials: false
      - name: Find the verified bundle from the push to main
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ needs.PinMain.outputs.commit }}
        run: python3 py/ci/find_deploy_bundle.py
      - name: Checkout pinned main for a missing bundle
        if: steps.published.outputs.run-id == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.PinMain.outputs.commit }}
          path: main
          persist-credentials: false
      - name: Build a run-local fallback
        if: steps.published.outputs.run-id == ''
        uses: ./.github/actions/build-deploy-bundle
        with:
          artifact-name: deploy-v2-main-${{ needs.PinMain.outputs.commit }}
          source-directory: main

  Deploy:
    needs: [MainBundle, BuildCandidate]
    permissions:
      actions: read
      contents: read
      id-token: write
    # Keep the main -> candidate state transition atomic with respect to Submit
    # and other merge groups.
    concurrency:
      group: pulumi_deploy
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current merge group
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}
          sparse-checkout: ci/deploy
          persist-credentials: false
      - name: Verify the merge group is still current
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Download pinned main bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.MainBundle.outputs.run-id }}
          name: ${{ needs.MainBundle.outputs.artifact-name }}
          path: ${{ runner.temp }}/bundles/staging-main
      - name: Download candidate bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: staging-candidate
          path: ${{ runner.temp }}/bundles/staging-candidate
      - uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093'  # v3.0.0
        name: Acquire federated GCloud credentials for secrets.
        with:
          project_id: 'extreme-cycling-441523-a9'
          workload_identity_provider: 'projects/845702659200/locations/global/workloadIdentityPools/github/providers/my-repo'
      - uses: 'google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262'  # v3.0.0
        name: Read CI secrets from Secret Manager
        id: secrets
        with:
          secrets: |-
            personal_phone_number:extreme-cycling-441523-a9/github-actions-personal-phone-number
            pulumi_access_token:extreme-cycling-441523-a9/github-actions-pulumi-access-token
            twilio_account_sid:extreme-cycling-441523-a9/github-actions-twilio-account-sid
            twilio_api_key_sid:extreme-cycling-441523-a9/github-actions-twilio-api-key-sid
            twilio_auth_token:extreme-cycling-441523-a9/github-actions-twilio-auth-token
      - uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093'  # v3.0.0
        name: Acquire GCloud credentials for staging.
        with:
          project_id: 'extreme-cycling-441523-a9'
          workload_identity_provider: 'projects/845702659200/locations/global/workloadIdentityPools/github/providers/my-repo'
          service_account: monorepo-root@extreme-cycling-441523-a9.iam.gserviceaccount.com
      - name: Configure AWS credentials via OIDC (staging)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::658613637108:role/monorepo_github_actions_role-4ad3390
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: us-east-1
      - name: Deploy main to staging
        run: ci/deploy/run.sh "$RUNNER_TEMP/bundles/staging-main" ci/deploy/deploy main
        env:
          PULUMI_ACCESS_TOKEN: ${{ steps.secrets.outputs.pulumi_access_token }}
          TWILIO_ACCOUNT_SID: ${{ steps.secrets.outputs.twilio_account_sid }}
          TWILIO_API_KEY_SID: ${{ steps.secrets.outputs.twilio_api_key_sid }}
          TWILIO_AUTH_TOKEN: ${{ steps.secrets.outputs.twilio_auth_token }}
          PERSONAL_PHONE_NUMBER: ${{ steps.secrets.outputs.personal_phone_number }}
      - uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093'  # v3.0.0
        name: Refresh GCloud credentials for the candidate
        with:
          project_id: 'extreme-cycling-441523-a9'
          workload_identity_provider: 'projects/845702659200/locations/global/workloadIdentityPools/github/providers/my-repo'
          service_account: monorepo-root@extreme-cycling-441523-a9.iam.gserviceaccount.com
      - name: Refresh AWS credentials for the candidate
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::658613637108:role/monorepo_github_actions_role-4ad3390
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: us-east-1
      - name: Deploy candidate branch to Staging
        run: ci/deploy/run.sh "$RUNNER_TEMP/bundles/staging-candidate" ci/deploy/deploy candidate
        env:
          PULUMI_ACCESS_TOKEN: ${{ steps.secrets.outputs.pulumi_access_token }}
          TWILIO_ACCOUNT_SID: ${{ steps.secrets.outputs.twilio_account_sid }}
          TWILIO_API_KEY_SID: ${{ steps.secrets.outputs.twilio_api_key_sid }}
          TWILIO_AUTH_TOKEN: ${{ steps.secrets.outputs.twilio_auth_token }}
          PERSONAL_PHONE_NUMBER: ${{ steps.secrets.outputs.personal_phone_number }}

  # A skipped job satisfies a required check. Propagate build and deploy
  # failures even when Actions skipped the dependent deployment entirely.
  Staging:
    if: always()
    needs: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful deployment
        env:
          DEPLOY_RESULT: ${{ needs.Deploy.result }}
        run: test "$DEPLOY_RESULT" = success
