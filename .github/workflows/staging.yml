# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---

name: Staging
# yamllint disable rule:line-length
#

on:   # yamllint disable-line rule:truthy
  merge_group:
    branches:
      # presubmit
      - main
      - renovate/**

env:
  BAZEL: ./sh/bin/bazel

jobs:
  Staging:
    permissions:
      contents: read
      id-token: write
    # Pulumi doesn't like it when multiple deploys are attempted at once.
    # This is also enforced at the pulumi layer, but i'm sure github actions
    # would make me pay while that thread waits to acquire the lock.
    concurrency:
      group: pulumi_deploy
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false
          swap-storage: true
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      # Main may not yet contain the archive fallback. Seed it from the candidate
      # outside the checkout so it also survives switching back to the candidate.
      - name: Checkout candidate dependency archives
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          path: dependency-archives
          sparse-checkout: third_party/bazel_distdir
      - name: Verify the merge group is still current
        run: test "$(git -C dependency-archives rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Seed dependency archives for both staging builds
        run: |
          mkdir -p "$RUNNER_TEMP/bazel-distdir"
          if [ -d dependency-archives/third_party/bazel_distdir ]; then
            cp -R dependency-archives/third_party/bazel_distdir/. "$RUNNER_TEMP/bazel-distdir/"
          fi
          # Keep the temporary checkout out of subsequent Gazelle scans.
          rm -rf -- dependency-archives
      - uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
        name: Acquire federated GCloud credentials for secrets.
        id: secret_auth
        with:
          project_id: 'extreme-cycling-441523-a9'
          workload_identity_provider: 'projects/845702659200/locations/global/workloadIdentityPools/github/providers/my-repo'
      - uses: 'google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262' # v3.0.0
        name: Read CI secrets from Secret Manager
        id: secrets
        with:
          secrets: |-
            buildbuddy_api_key:extreme-cycling-441523-a9/github-actions-buildbuddy-api-key
            personal_phone_number:extreme-cycling-441523-a9/github-actions-personal-phone-number
            pulumi_access_token:extreme-cycling-441523-a9/github-actions-pulumi-access-token
            twilio_account_sid:extreme-cycling-441523-a9/github-actions-twilio-account-sid
            twilio_api_key_sid:extreme-cycling-441523-a9/github-actions-twilio-api-key-sid
            twilio_auth_token:extreme-cycling-441523-a9/github-actions-twilio-auth-token
      - uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
        name: Acquire GCloud credentials for first deploy.
        id: auth
        with:
          project_id: 'extreme-cycling-441523-a9'
          workload_identity_provider: 'projects/845702659200/locations/global/workloadIdentityPools/github/providers/my-repo'
          service_account: monorepo-root@extreme-cycling-441523-a9.iam.gserviceaccount.com
      - name: Configure AWS credentials via OIDC (staging)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::658613637108:role/monorepo_github_actions_role-4ad3390
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: us-east-1
      - name: Pulumi up from origin/main to staging
        run: |
          ./.github/workflows/prepare_ci.sh
          $BAZEL run --config=ci --tool_tag=staging \
            --distdir="$RUNNER_TEMP/bazel-distdir/ape" --distdir="$RUNNER_TEMP/bazel-distdir/rules_diff" \
            //ci/deploy:deploy -- main
        env:
          PULUMI_ACCESS_TOKEN: ${{ steps.secrets.outputs.pulumi_access_token }}
          BUILDBUDDY_API_KEY: ${{ steps.secrets.outputs.buildbuddy_api_key }}
          TWILIO_ACCOUNT_SID: ${{ steps.secrets.outputs.twilio_account_sid }}
          TWILIO_API_KEY_SID: ${{ steps.secrets.outputs.twilio_api_key_sid }}
          TWILIO_AUTH_TOKEN: ${{ steps.secrets.outputs.twilio_auth_token }}
          # i guess if you exfil this secret you can also call me instead
          # of making a security report 🤣
          PERSONAL_PHONE_NUMBER: ${{ steps.secrets.outputs.personal_phone_number }}
      - name: Switch back to candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
        name: Re-acquire GCloud credentials after checkout...
        id: auth2
        with:
          project_id: 'extreme-cycling-441523-a9'
          workload_identity_provider: 'projects/845702659200/locations/global/workloadIdentityPools/github/providers/my-repo'
          service_account: monorepo-root@extreme-cycling-441523-a9.iam.gserviceaccount.com
      - name: Re-configure AWS credentials via OIDC (staging)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::658613637108:role/monorepo_github_actions_role-4ad3390
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: us-east-1
      - name: Deploy candidate branch to Staging
        run: |
          ./.github/workflows/prepare_ci.sh
          $BAZEL run --config=ci --tool_tag=staging \
            --distdir="$RUNNER_TEMP/bazel-distdir/ape" --distdir="$RUNNER_TEMP/bazel-distdir/rules_diff" \
            //ci/deploy:deploy -- candidate
        env:
          PULUMI_ACCESS_TOKEN: ${{ steps.secrets.outputs.pulumi_access_token }}
          BUILDBUDDY_API_KEY: ${{ steps.secrets.outputs.buildbuddy_api_key }}
          TWILIO_ACCOUNT_SID: ${{ steps.secrets.outputs.twilio_account_sid }}
          TWILIO_API_KEY_SID: ${{ steps.secrets.outputs.twilio_api_key_sid }}
          TWILIO_AUTH_TOKEN: ${{ steps.secrets.outputs.twilio_auth_token }}
          PERSONAL_PHONE_NUMBER: ${{ steps.secrets.outputs.personal_phone_number }}
