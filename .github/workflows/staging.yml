# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---

name: Staging
# yamllint disable rule:line-length
#

on:   # yamllint disable-line rule:truthy
  merge_group:
    branches:
      # presubmit
      - main
      - renovate/**

permissions:
  contents: read

jobs:
  Build:
    name: Build staging bundle (${{ matrix.revision }})
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        revision: [main, candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # main
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false
          swap-storage: true
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Save candidate build inputs for main
        if: matrix.revision == 'main'
        run: |
          if [ -d third_party/bazel_distdir ]; then
            cp -R third_party/bazel_distdir "$RUNNER_TEMP/bazel-distdir"
          fi
          cp -R ci/staging/deploy "$RUNNER_TEMP/deploy"
      - name: Checkout main branch
        if: matrix.revision == 'main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
      - uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093'  # v3.0.0
        name: Acquire federated GCloud credentials for secrets.
        with:
          project_id: 'extreme-cycling-441523-a9'
          workload_identity_provider: 'projects/845702659200/locations/global/workloadIdentityPools/github/providers/my-repo'
      - uses: 'google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262'  # v3.0.0
        name: Read CI secrets from Secret Manager
        id: secrets
        with:
          secrets: |-
            buildbuddy_api_key:extreme-cycling-441523-a9/github-actions-buildbuddy-api-key
      - name: Check repository, build and verify staging bundle
        env:
          BUILDBUDDY_API_KEY: ${{ steps.secrets.outputs.buildbuddy_api_key }}
        run: |
          ./.github/workflows/prepare_ci.sh
          flags=(--config=ci --tool_tag=staging --distdir="$RUNNER_TEMP/bazel-distdir/ape" --distdir="$RUNNER_TEMP/bazel-distdir/rules_diff")
          ./sh/bin/bazel run "${flags[@]}" //sh/bin:go -- mod tidy
          ./sh/bin/bazel run "${flags[@]}" //:gazelle -- --mode diff --strict

          # Bootstrap the launcher on the first run against a main without it.
          # The Pulumi program and every deployment asset still come from main.
          if [ ! -d ci/staging/deploy ]; then
            cp -R "$RUNNER_TEMP/deploy" ci/staging/deploy
          fi
          ./sh/bin/bazel test "${flags[@]}" //ci/staging/deploy:bundle //ci/staging/deploy:bundle_test
      - name: Upload staging bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: staging-${{ matrix.revision }}
          path: dist/bin/ci/staging/deploy/layers_bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  Deploy:
    needs: Build
    permissions:
      contents: read
      id-token: write
    # Keep the main -> candidate state transition atomic with respect to Submit
    # and other merge groups.
    concurrency:
      group: pulumi_deploy
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current merge group
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}
          sparse-checkout: ci/staging/deploy
          persist-credentials: false
      - name: Verify the merge group is still current
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Download staging bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: staging-*
          path: ${{ runner.temp }}/bundles
      - uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093'  # v3.0.0
        name: Acquire federated GCloud credentials for secrets.
        with:
          project_id: 'extreme-cycling-441523-a9'
          workload_identity_provider: 'projects/845702659200/locations/global/workloadIdentityPools/github/providers/my-repo'
      - uses: 'google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262'  # v3.0.0
        name: Read CI secrets from Secret Manager
        id: secrets
        with:
          secrets: |-
            personal_phone_number:extreme-cycling-441523-a9/github-actions-personal-phone-number
            pulumi_access_token:extreme-cycling-441523-a9/github-actions-pulumi-access-token
            twilio_account_sid:extreme-cycling-441523-a9/github-actions-twilio-account-sid
            twilio_api_key_sid:extreme-cycling-441523-a9/github-actions-twilio-api-key-sid
            twilio_auth_token:extreme-cycling-441523-a9/github-actions-twilio-auth-token
      - uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093'  # v3.0.0
        name: Acquire GCloud credentials for staging.
        with:
          project_id: 'extreme-cycling-441523-a9'
          workload_identity_provider: 'projects/845702659200/locations/global/workloadIdentityPools/github/providers/my-repo'
          service_account: monorepo-root@extreme-cycling-441523-a9.iam.gserviceaccount.com
      - name: Configure AWS credentials via OIDC (staging)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::658613637108:role/monorepo_github_actions_role-4ad3390
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: us-east-1
      - name: Deploy main to staging
        run: ci/staging/deploy/run.sh "$RUNNER_TEMP/bundles/staging-main/layers_bundle.tar.gz" main
        env:
          PULUMI_ACCESS_TOKEN: ${{ steps.secrets.outputs.pulumi_access_token }}
          TWILIO_ACCOUNT_SID: ${{ steps.secrets.outputs.twilio_account_sid }}
          TWILIO_API_KEY_SID: ${{ steps.secrets.outputs.twilio_api_key_sid }}
          TWILIO_AUTH_TOKEN: ${{ steps.secrets.outputs.twilio_auth_token }}
          PERSONAL_PHONE_NUMBER: ${{ steps.secrets.outputs.personal_phone_number }}
      - uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093'  # v3.0.0
        name: Refresh GCloud credentials for the candidate
        with:
          project_id: 'extreme-cycling-441523-a9'
          workload_identity_provider: 'projects/845702659200/locations/global/workloadIdentityPools/github/providers/my-repo'
          service_account: monorepo-root@extreme-cycling-441523-a9.iam.gserviceaccount.com
      - name: Refresh AWS credentials for the candidate
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::658613637108:role/monorepo_github_actions_role-4ad3390
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: us-east-1
      - name: Deploy candidate branch to Staging
        run: ci/staging/deploy/run.sh "$RUNNER_TEMP/bundles/staging-candidate/layers_bundle.tar.gz" candidate
        env:
          PULUMI_ACCESS_TOKEN: ${{ steps.secrets.outputs.pulumi_access_token }}
          TWILIO_ACCOUNT_SID: ${{ steps.secrets.outputs.twilio_account_sid }}
          TWILIO_API_KEY_SID: ${{ steps.secrets.outputs.twilio_api_key_sid }}
          TWILIO_AUTH_TOKEN: ${{ steps.secrets.outputs.twilio_auth_token }}
          PERSONAL_PHONE_NUMBER: ${{ steps.secrets.outputs.personal_phone_number }}

  # A skipped job satisfies a required check. Propagate build and deploy
  # failures even when Actions skipped the dependent deployment entirely.
  Staging:
    if: always()
    needs: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful deployment
        env:
          DEPLOY_RESULT: ${{ needs.Deploy.result }}
        run: test "$DEPLOY_RESULT" = success
